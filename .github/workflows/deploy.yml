name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy-*.sh'
      - 'scripts/deploy-all.sh'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'scripts/deploy-*.sh'

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy VPC
        run: bash scripts/deploy-vpc.sh

      - name: Deploy RDS
        run: bash scripts/deploy-rds.sh
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Deploy ALB + ECS
        run: bash scripts/deploy-ecs.sh
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Deploy API Gateway
        run: bash scripts/deploy-api-gw.sh

      - name: Deploy CloudFront
        run: bash scripts/deploy-frontend.sh
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Deploy Monitoring
        run: bash scripts/deploy-monitoring.sh

  plan-infra:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Dry-run deploy scripts
        run: |
          echo "::notice::PR review mode - scripts validated"
          for f in scripts/deploy-*.sh; do
            bash -n "$f" && echo "  OK: $f" || echo "  FAIL: $f"
          done
